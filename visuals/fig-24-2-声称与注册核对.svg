l="#E69F00"/><text x="108" y="244" class="nodeTitle">常见错位</text><line x1="86" x2="410" y1="260" y2="260" stroke="#e0e9e9"/><circle cx="92" cy="287" r="3.5" fill="#E69F00"/><text x="106" y="292" class="body">妆字号用于注射</text><circle cx="92" cy="323" r="3.5" fill="#E69F00"/><text x="106" y="328" class="body">械字号讲药理功效</text><circle cx="92" cy="359" r="3.5" fill="#E69F00"/><text x="106" y="364" class="body">「医用」被泛化</text><rect width="372" height="250" x="466" y="205" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="17"/><circle cx="492" cy="237" r="10" fill="#0072B2"/><text x="512" y="244" class="nodeTitle">核对方法</text><line x1="490" x2="814" y1="260" y2="260" stroke="#e0e9e9"/><circle cx="496" cy="287" r="3.5" fill="#0072B2"/><text x="510" y="292" class="body">查获批类别</text><circle cx="496" cy="323" r="3.5" fill="#0072B2"/><text x="510" y="328" class="body">对照宣称与范围</text><circle cx="496" cy="359" r="3.5" fill="#0072B2"/><text x="510" y="364" class="body">错位即为红旗</text><rect width="776" height="72" x="62" y="474" fill="#eef6f8" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">身份与说辞不匹配，就是最大的破绽</text><text x="62" y="570" class="footer">专业篇示意 · 监管口径以当前规定为准</text></svg>