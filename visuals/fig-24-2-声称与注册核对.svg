  <rect x="62" y="205" width="372" height="250" rx="17" fill="#f8fbfb" stroke="#E69F00" stroke-width="2"/>
  <circle cx="88" cy="237" r="10" fill="#E69F00"/>
  <text x="108" y="244" class="nodeTitle">常见错位</text>
  <line x1="86" y1="260" x2="410" y2="260" stroke="#e0e9e9"/>
  <circle cx="92" cy="287" r="3.5" fill="#E69F00"/>
