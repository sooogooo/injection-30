<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">药品、器械与三无的三条轨道</title>
  <desc id="desc">药品、器械与三无产品三轨示意</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <linearGradient id="axg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0072B2"/>
      <stop offset="0.55" stop-color="#E69F00"/>
      <stop offset="1" stop-color="#D55E00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; letter-spacing: 1.4px; fill: #0072B2; }
      .title { font: 700 31px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #52656c; }
      .nodeTitle { font: 700 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .body { font: 500 15px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #3e5057; }
      .small { font: 500 13px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #5c6c72; }
      .quote { font: 700 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .footer { font: 500 12px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #68787e; }
      .tag { font: 700 13px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#shadow)"/>
  <text x="62" y="68" class="series">注射美容 30 讲 · 03</text>
  <text x="62" y="117" class="title">药品、器械与三无的三条轨道</text>
  <text x="62" y="153" class="kicker">一支针剂只可能处于三种监管状态之一</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>
  <rect x="62" y="205" width="240" height="250" rx="17" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="88" cy="237" r="10" fill="#0072B2"/>
  <text x="108" y="244" class="nodeTitle">按药品管理</text>
  <line x1="86" y1="260" x2="278" y2="260" stroke="#e0e9e9"/>
  <circle cx="92" cy="287" r="3.5" fill="#0072B2"/>
  <text x="106" y="292" class="body">如肉毒毒素类</text>
  <circle cx="92" cy="323" r="3.5" fill="#0072B2"/>
  <text x="106" y="328" class="body">处方药管理</text>
  <circle cx="92" cy="359" r="3.5" fill="#0072B2"/>
  <text x="106" y="364" class="body">批准文号可查</text>
  <rect x="330" y="205" width="240" height="250" rx="17" fill="#f8fbfb" stroke="#56B4E9" stroke-width="2"/>
  <circle cx="356" cy="237" r="10" fill="#56B4E9"/>
  <text x="376" y="244" class="nodeTitle">按器械管理</text>
  <line x1="354" y1="260" x2="546" y2="260" stroke="#e0e9e9"/>
  <circle cx="360" cy="287" r="3.5" fill="#56B4E9"/>
  <text x="374" y="292" class="body">如注射填充剂</text>
  <circle cx="360" cy="323" r="3.5" fill="#56B4E9"/>
  <text x="374" y="328" class="body">注册证可查</text>
  <circle cx="360" cy="359" r="3.5" fill="#56B4E9"/>
  <text x="374" y="364" class="body">载明适用范围</text>
  <rect x="598" y="205" width="240" height="250" rx="17" fill="#f8fbfb" stroke="#D55E00" stroke-width="2"/>
  <circle cx="624" cy="237" r="10" fill="#D55E00"/>
  <text x="644" y="244" class="nodeTitle">三无产品</text>
  <line x1="622" y1="260" x2="814" y2="260" stroke="#e0e9e9"/>
  <circle cx="628" cy="287" r="3.5" fill="#D55E00"/>
  <text x="642" y="292" class="body">查无注册信息</text>
  <circle cx="628" cy="323" r="3.5" fill="#D55E00"/>
  <text x="642" y="328" class="body">来源不可追溯</text>
  <circle cx="628" cy="359" r="3.5" fill="#D55E00"/>
  <text x="642" y="364" class="body">合法场所不可用</text>
  <rect x="62" y="474" width="776" height="72" rx="16" fill="#eef6f8"/>
  <text x="450" y="518" class="quote" text-anchor="middle">查不到，就当它不存在</text>
  <text x="62" y="570" class="footer">监管状态以当前公示为准 · 医学科普示意</text>
