" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="231" r="9" fill="#009E73"/><text x="112" y="237" class="nodeTitle">中和抗体可发生</text><text x="330" y="237" class="body">与制剂蛋白载量等因素相关</text><text x="826" y="237" fill="#009E73" class="tag" text-anchor="end">较稳定</text><rect width="776" height="53" x="62" y="270" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="296" r="9" fill="#009E73"/><text x="112" y="302" class="nodeTitle">部分无应答与抗体相关</text><text x="330" y="302" class="body">继发无应答的机制之一</text><text x="826" y="302" fill="#009E73" class="tag" text-anchor="end">较稳定</text><rect width="776" height="53" x="62" y="335" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="361" r="9" fill="#E69F00"/><text x="112" y="367" class="nodeTitle">高频高量增加风险</text><text x="330" y="367" class="body">以观察性证据为主</text><text x="826" y="367" fill="#E69F00" class="tag" text-anchor="end">有限</text><rect width="776" height="53" x="62" y="400" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="426" r="9" fill="#E69F00"/><text x="112" y="432" class="nodeTitle">换制剂可恢复应答</text><text x="330" y="432" class="body">个案与小样本报告</text><text x="826" y="432" fill="#E69F00" class="tag" text-anchor="end">有限</text><rect width="776" height="72" x="62" y="474" fill="#eef6f8" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">把「可能」当「必然」，会做出错误决策</text><text x="62" y="570" class="footer">专业篇示意 · 依据 Ho 2022 国际共识等文献，不构成诊疗规范</text></svg>