L 36 66 L 26 60 Z"/><path fill="#E69F00" d="M -48 96 Q -48 66 -22 62 L 22 62 Q 48 66 48 96 L 48 206 Q 48 220 34 220 L -34 220 Q -48 220 -48 206 Z"/><path fill="none" stroke="#fff" stroke-width="2.5" d="M -22 62 Q 0 78 22 62" opacity=".7"/></g><circle cx="330" cy="330" r="46" fill="#fdf0ec" stroke="#D55E00" stroke-width="3.5"/><rect width="8" height="34" x="326" y="304" fill="#D55E00" rx="4"/><circle cx="330" cy="352" r="5" fill="#D55E00"/><rect width="748" height="76" x="76" y="580" fill="#fdf6f2" stroke="#D55E00" stroke-width="2" rx="14"/><path fill="none" stroke="#D55E00" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M 106 602 L 106 634 M 106 602 L 130 610 L 106 618"/><text x="150" y="615" class="nodeTitle">剧烈疼痛</text><text x="150" y="641" class="small">与平时注射不适明显不同</text><rect width="748" height="76" x="76" y="672" fill="#fdf6f2" stroke="#D55E00" stroke-width="2" rx="14"/><path fill="none" stroke="#D55E00" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M 106 694 L 106 726 M 106 694 L 130 702 L 106 710"/><text x="150" y="707" class="nodeTitle">皮肤苍白或花斑</text><text x="150" y="733" class="small">注射区或更远处皮色改变</text><rect width="748" height="76" x="76" y="764" fill="#fdf6f2" stroke="#D55E00" stroke-width="2" rx="14"/><path fill="none" stroke="#D55E00" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M 106 786 L 106 818 M 106 786 L 130 794 L 106 802"/><text x="150" y="799" class="nodeTitle">视力变化</text><text x="150" y="825" class="small">视物模糊、黑朦或失明</text><rect width="748" height="76" x="76" y="856" fill="#fdf6f2" stroke="#D55E00" stroke-width="2" rx="14"/><path fill="none" stroke="#D55E00" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M 106 878 L 106 910 M 106 878 L 130 886 L 106 894"/><text x="150" y="891" class="nodeTitle">剧烈头痛伴其他症状</text><text x="150" y="917" class="small">神经系统警报</text><rect width="330" height="150" x="430" y="290" fill="#f8fbfb" stroke="#e3ebeb" rx="18"/><text x="595" y="330" class="nodeTitle" text-anchor="middle">时间窗以分钟计</text><text x="595" y="362" class="small" text-anchor="middle">立即告知操作者，停止一切操作</text><text x="595" y="388" class="small" text-anchor="middle">前往有处置能力的医疗机构</text><text x="595" y="414" class="small" text-anchor="middle">说清注射时间、部位与产品</text><rect width="748" height="82" x="76" y="1020" fill="#fdf0ec" rx="18"/><text x="450" y="1071" class="quote" text-anchor="middle">这几分钟的反应速度，就是结局的分界线</text><text x="76" y="1136" class="footer">急症请立即就医 · 本图不替代医生判断</text></svg>