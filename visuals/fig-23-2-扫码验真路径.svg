#56B4E9"/><text x="107" y="259" class="nodeTitle">索取包装</text><text x="147" y="315" class="body" text-anchor="middle"><tspan x="147" dy="0">拒绝已开封</tspan> <tspan x="147" dy="27">或无包装产品</tspan></text><path stroke="#7d8e93" stroke-width="2" d="M 240 330 L 256 330"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 250 325 L 256 330 L 250 335"/><rect width="170" height="210" x="264" y="225" fill="#f8fbfb" stroke="#E69F00" stroke-width="2" rx="17"/><circle cx="289" cy="252" r="11" fill="#E69F00"/><text x="309" y="259" class="nodeTitle">找到证号</text><text x="349" y="315" class="body" text-anchor="middle"><tspan x="349" dy="0">注册证号</tspan> <tspan x="349" dy="27">或批准文号</tspan></text><path stroke="#7d8e93" stroke-width="2" d="M 442 330 L 458 330"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 452 325 L 458 330 L 452 335"/><rect width="170" height="210" x="466" y="225" fill="#f8fbfb" stroke="#009E73" stroke-width="2" rx="17"/><circle cx="491" cy="252" r="11" fill="#009E73"/><text x="511" y="259" class="nodeTitle">官方查询</text><text x="551" y="315" class="body" text-anchor="middle"><tspan x="551" dy="0">监管数据库</tspan> <tspan x="551" dy="27">而非商家链接</tspan></text><path stroke="#7d8e93" stroke-width="2" d="M 644 330 L 660 330"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 654 325 L 660 330 L 654 335"/><rect width="170" height="210" x="668" y="225" fill="#f8fbfb" stroke="#CC79A7" stroke-width="2" rx="17"/><circle cx="693" cy="252" r="11" fill="#CC79A7"/><text x="713" y="259" class="nodeTitle">逐项核对</text><text x="753" y="315" class="body" text-anchor="middle"><tspan x="753" dy="0">品名企业规格</tspan> <tspan x="753" dy="27">不符即停止</tspan></text><rect width="776" height="72" x="62" y="474" fill="#eef6f8" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">商家给的链接不算数，官方查到的才算</text><text x="62" y="570" class="footer">医学科普示意 · 不构成个体诊疗建议，具体决策请面诊</text></svg>