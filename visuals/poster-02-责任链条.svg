    <path d="M 32 34 L 36 66 L 26 60 Z" fill="#3a4a52"/>
    <path d="M -48 96 Q -48 66 -22 62 L 22 62 Q 48 66 48 96 L 48 206 Q 48 220 34 220 L -34 220 Q -48 220 -48 206 Z" fill="#E69F00"/>
    <path d="M -22 62 Q 0 78 22 62" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
  </g>
  <g transform="translate(640 620) scale(-1.1 1.1)">
    <path d="M -30 18 A 30 30 0 0 1 30 18 L 30 6 A 30 30 0 0 0 -30 6 Z" fill="#2f3e46"/>
    <circle cx="0" cy="30" r="28" fill="#f6dcc8"/>
    <path d="M -32 26 Q -32 -2 0 -2 Q 32 -2 32 26 L 32 14 Q 24 2 0 2 Q -24 2 -32 14 Z" fill="#2f3e46"/>
    <path d="M -52 92 Q -52 66 -26 62 L 26 62 Q 52 66 52 92 L 52 210 Q 52 222 40 222 L -40 222 Q -52 222 -52 210 Z" fill="#ffffff" stroke="#c9d8de" stroke-width="2.5"/>
    <path d="M 0 66 L -14 92 L 0 180 L 14 92 Z" fill="#56B4E9" opacity="0.85"/>
    <path d="M -26 62 L 0 92 L 26 62" fill="none" stroke="#c9d8de" stroke-width="2.5"/>
    <rect x="18" y="104" width="20" height="13" rx="3" fill="#0072B2"/>
    <path d="M -14 66 Q -14 96 0 96 Q 14 96 14 66" fill="none" stroke="#009E73" stroke-width="3"/>
    <circle cx="0" cy="100" r="5" fill="#009E73"/>
  </g>
  <path d="M 320 740 L 560 740" stroke="#7d8e93" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M 552 734 L 560 740 L 552 746" fill="none" stroke="#7d8e93" stroke-width="2.5"/>
  <path d="M 328 734 L 320 740 L 328 746" fill="none" stroke="#7d8e93" stroke-width="2.5"/>
  <rect x="76" y="900" width="748" height="86" rx="14" fill="#f8fbfb" stroke="#e3ebeb"/>
  <text x="450" y="936" class="body" text-anchor="middle">产品是真的，但打针的人没有资质，链条断了</text>
  <text x="450" y="966" class="body" text-anchor="middle">医生是真的，但场所没有急救条件，链条也断了</text>
  <rect x="76" y="1020" width="748" height="82" rx="18" fill="#eef6f8"/>
  <text x="450" y="1071" class="quote" text-anchor="middle">链条的强度取决于最弱的一环</text>
  <text x="76" y="1136" class="footer">医学科普示意 · 各环节核验方法见系列各篇</text>
</svg>