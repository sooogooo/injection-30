<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">识别、处置与转诊</title>
  <desc id="desc">血管并发症识别处置转诊流程</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <linearGradient id="axg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0072B2"/>
      <stop offset="0.55" stop-color="#E69F00"/>
      <stop offset="1" stop-color="#D55E00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; letter-spacing: 1.4px; fill: #0072B2; }
      .title { font: 700 31px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #52656c; }
      .nodeTitle { font: 700 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .body { font: 500 15px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #3e5057; }
      .small { font: 500 13px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #5c6c72; }
      .quote { font: 700 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .footer { font: 500 12px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #68787e; }
      .tag { font: 700 13px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#shadow)"/>
  <text x="62" y="68" class="series">注射美容 30 讲 · 18</text>
  <text x="62" y="117" class="title">识别、处置与转诊</text>
  <text x="62" y="153" class="kicker">血管并发症的处置时间窗以分钟计</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>
  <rect x="62" y="225" width="170" height="210" rx="17" fill="#f8fbfb" stroke="#D55E00" stroke-width="2"/>
  <circle cx="87" cy="252" r="11" fill="#D55E00"/>
  <text x="107" y="259" class="nodeTitle">识别</text>
  <text x="147" y="315" class="body" text-anchor="middle">
    <tspan x="147" dy="0">疼痛皮色视力</tspan>
    <tspan x="147" dy="27">异常即警报</tspan>
  </text>
  <path d="M 240 330 L 256 330" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 250 325 L 256 330 L 250 335" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <rect x="264" y="225" width="170" height="210" rx="17" fill="#f8fbfb" stroke="#E69F00" stroke-width="2"/>
  <circle cx="289" cy="252" r="11" fill="#E69F00"/>
  <text x="309" y="259" class="nodeTitle">即刻处置</text>
  <text x="349" y="315" class="body" text-anchor="middle">
    <tspan x="349" dy="0">停止注射</tspan>
    <tspan x="349" dy="27">启动预案</tspan>
  </text>
  <path d="M 442 330 L 458 330" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 452 325 L 458 330 L 452 335" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <rect x="466" y="225" width="170" height="210" rx="17" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="491" cy="252" r="11" fill="#0072B2"/>
  <text x="511" y="259" class="nodeTitle">团队响应</text>
  <text x="551" y="315" class="body" text-anchor="middle">
    <tspan x="551" dy="0">按分工执行</tspan>
    <tspan x="551" dy="27">记录时间线</tspan>
  </text>
  <path d="M 644 330 L 660 330" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 654 325 L 660 330 L 654 335" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <rect x="668" y="225" width="170" height="210" rx="17" fill="#f8fbfb" stroke="#009E73" stroke-width="2"/>
  <circle cx="693" cy="252" r="11" fill="#009E73"/>
  <text x="713" y="259" class="nodeTitle">转诊</text>
  <text x="753" y="315" class="body" text-anchor="middle">
    <tspan x="753" dy="0">需要时立即转</tspan>
    <tspan x="753" dy="27">信息随人走</tspan>
  </text>
  <rect x="62" y="474" width="776" height="72" rx="16" fill="#eef6f8"/>
  <text x="450" y="518" class="quote" text-anchor="middle">流程的意义，是让慌乱时也有正确动作</text>
  <text x="62" y="570" class="footer">专业篇流程示意 · 具体处置遵循临床规范与指南</text>
</svg>