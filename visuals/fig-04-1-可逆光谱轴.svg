<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title desc" role="img" viewBox="0 0 900 620"><title id="title">可逆与不可逆是一条光谱</title><desc id="desc">注射材料的可逆与不可逆光谱轴</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><linearGradient id="axg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0072B2"/><stop offset=".55" stop-color="#E69F00"/><stop offset="1" stop-color="#D55E00"/></linearGradient><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 20px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#shadow)" opacity=".96" rx="24"/><text x="62" y="68" class="series">注射美容 30 讲 · 04</text><text x="62" y="117" class="title">可逆与不可逆是一条光谱</text><text x="62" y="153" class="kicker">不同材料处于不同位置，位置决定试错成本</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><path stroke="url(#axg)" stroke-linecap="round" stroke-width="4" d="M 110 350 L 790 350"/><circle cx="110" cy="350" r="10" fill="#0072B2" stroke="#fff" stroke-width="2.5"/><text x="110" y="305" class="nodeTitle" text-anchor="middle">可降解可溶解</text><text x="110" y="392" class="small" text-anchor="middle"><tspan x="110" dy="0">部分透明质酸类</tspan> <tspan x="110" dy="20">有溶解酶可干预</tspan></text><circle cx="336" cy="350" r="10" fill="#E69F00" stroke="#fff" stroke-width="2.5"/><text x="336" y="305" class="nodeTitle" text-anchor="middle">可降解难即撤</text><text x="336" y="392" class="small" text-anchor="middle"><tspan x="336" dy="0">刺激胶原类材料</tspan> <tspan x="336" dy="20">过程无法立即中止</tspan></text><circle cx="563" cy="350" r="10" fill="#CC79A7" stroke="#fff" stroke-width="2.5"/><text x="563" y="305" class="nodeTitle" text-anchor="middle">长效或永久</text><text x="563" y="392" class="small" text-anchor="middle"><tspan x="563" dy="0">不可降解材料</tspan> <tspan x="563" dy="20">移除常需手术</tspan></text><circle cx="790" cy="350" r="10" fill="#D55E00" stroke="#fff" stroke-width="2.5"/><text x="790" y="305" class="nodeTitle" text-anchor="middle">扩散难清除</text><text x="790" y="392" class="small" text-anchor="middle"><tspan x="790" dy="0">非法注射物渗散</tspan> <tspan x="790" dy="20">可能无法彻底取出</tspan></text><text x="62" y="245" fill="#0072B2" class="small">◀ 更可退</text><text x="838" y="245" fill="#D55E00" class="small" text-anchor="end">更难退 ▶</text><rect width="776" height="72" x="62" y="474" fill="#eef6f8" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">越靠右，越要在打之前想清楚</text><text x="62" y="570" class="footer">医学科普示意 · 不构成个体诊疗建议，具体决策请面诊</text></svg>