<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title desc" role="img" viewBox="0 0 900 620"><title id="title">溶解酶能做什么</title><desc id="desc">溶解酶作用边界对照</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><linearGradient id="axg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0072B2"/><stop offset=".55" stop-color="#E69F00"/><stop offset="1" stop-color="#D55E00"/></linearGradient><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.quote{font:700 20px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#shadow)" opacity=".96" rx="24"/><text x="62" y="68" class="series">注射美容 30 讲 · 15</text><text x="62" y="117" class="title">溶解酶能做什么</text><text x="62" y="153" class="kicker">它是重要工具，但有清晰的边界</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="372" height="250" x="62" y="205" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="17"/><circle cx="88" cy="237" r="10" fill="#0072B2"/><text x="108" y="244" class="nodeTitle">边界之内</text><line x1="86" x2="410" y1="260" y2="260" stroke="#e0e9e9"/><circle cx="92" cy="287" r="3.5" fill="#0072B2"/><text x="106" y="292" class="body">溶解透明质酸类</text><circle cx="92" cy="323" r="3.5" fill="#0072B2"/><text x="106" y="328" class="body">处理结节与矫正</text><circle cx="92" cy="359" r="3.5" fill="#0072B2"/><text x="106" y="364" class="body">血管事件抢救工具</text><rect width="372" height="250" x="466" y="205" fill="#f8fbfb" stroke="#E69F00" stroke-width="2" rx="17"/><circle cx="492" cy="237" r="10" fill="#E69F00"/><text x="512" y="244" class="nodeTitle">边界之外</text><line x1="490" x2="814" y1="260" y2="260" stroke="#e0e9e9"/><circle cx="496" cy="287" r="3.5" fill="#E69F00"/><text x="510" y="292" class="body">对非透明质酸无效</text><circle cx="496" cy="323" r="3.5" fill="#E69F00"/><text x="510" y="328" class="body">不保证完全复原</text><circle cx="496" cy="359" r="3.5" fill="#E69F00"/><text x="510" y="364" class="body">本身有过敏等风险</text><rect width="776" height="72" x="62" y="474" fill="#eef6f8" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">工具有边界，才叫工具</text><text x="62" y="570" class="footer">医学科普示意 · 不构成个体诊疗建议，具体决策请面诊</text></svg>