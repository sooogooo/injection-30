<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title desc" role="img" viewBox="0 0 900 620"><title id="title">药品、器械与三无的三条轨道</title><desc id="desc">药品、器械与三无产品三轨示意</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><linearGradient id="axg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0072B2"/><stop offset=".55" stop-color="#E69F00"/><stop offset="1" stop-color="#D55E00"/></linearGradient><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.quote{font:700 20px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#shadow)" opacity=".96" rx="24"/><text x="62" y="68" class="series">注射美容 30 讲 · 03</text><text x="62" y="117" class="title">药品、器械与三无的三条轨道</text><text x="62" y="153" class="kicker">一支针剂只可能处于三种监管状态之一</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="240" height="250" x="62" y="205" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="17"/><circle cx="88" cy="237" r="10" fill="#0072B2"/><text x="108" y="244" class="nodeTitle">按药品管理</text><line x1="86" x2="278" y1="260" y2="260" stroke="#e0e9e9"/><circle cx="92" cy="287" r="3.5" fill="#0072B2"/><text x="106" y="292" class="body">如肉毒毒素类</text><circle cx="92" cy="323" r="3.5" fill="#0072B2"/><text x="106" y="328" class="body">处方药管理</text><circle cx="92" cy="359" r="3.5" fill="#0072B2"/><text x="106" y="364" class="body">批准文号可查</text><rect width="240" height="250" x="330" y="205" fill="#f8fbfb" stroke="#56B4E9" stroke-width="2" rx="17"/><circle cx="356" cy="237" r="10" fill="#56B4E9"/><text x="376" y="244" class="nodeTitle">按器械管理</text><line x1="354" x2="546" y1="260" y2="260" stroke="#e0e9e9"/><circle cx="360" cy="287" r="3.5" fill="#56B4E9"/><text x="374" y="292" class="body">如注射填充剂</text><circle cx="360" cy="323" r="3.5" fill="#56B4E9"/><text x="374" y="328" class="body">注册证可查</text><circle cx="360" cy="359" r="3.5" fill="#56B4E9"/><text x="374" y="364" class="body">载明适用范围</text><rect width="240" height="250" x="598" y="205" fill="#f8fbfb" stroke="#D55E00" stroke-width="2" rx="17"/><circle cx="624" cy="237" r="10" fill="#D55E00"/><text x="644" y="244" class="nodeTitle">三无产品</text><line x1="622" x2="814" y1="260" y2="260" stroke="#e0e9e9"/><circle cx="628" cy="287" r="3.5" fill="#D55E00"/><text x="642" y="292" class="body">查无注册信息</text><circle cx="628" cy="323" r="3.5" fill="#D55E00"/><text x="642" y="328" class="body">来源不可追溯</text><circle cx="628" cy="359" r="3.5" fill="#D55E00"/><text x="642" y="364" class="body">合法场所不可用</text><rect width="776" height="72" x="62" y="474" fill="#eef6f8" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">查不到，就当它不存在</text><text x="62" y="570" class="footer">监管状态以当前公示为准 · 医学科普示意</text></svg>