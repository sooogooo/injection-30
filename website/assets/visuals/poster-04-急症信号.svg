<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">记住这几个急症信号</title>
  <desc id="desc">栓塞急症信号海报，包括剧烈疼痛、皮肤苍白或花斑、视力变化、剧烈头痛</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 16px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; letter-spacing: 2px; fill: #0072B2; }
      .title { font: 700 44px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .kicker { font: 500 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #52656c; }
      .nodeTitle { font: 700 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .body { font: 500 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #3e5057; }
      .small { font: 500 14px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #5c6c72; }
      .quote { font: 700 24px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .footer { font: 500 13px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #68787e; }
      .big { font: 700 26px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #ffffff; }
      .ringLabel { font: 700 18px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
    </style>
  </defs>
  <rect width="900" height="1200" rx="30" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="26" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#shadow)"/>
  <text x="76" y="104" class="series">注射美容 30 讲 · 安全卡</text>
  <text x="76" y="166" class="title">记住这几个急症信号</text>
  <text x="76" y="206" class="kicker">出现任何一条，立即告知医生并尽快就医</text>
  <line x1="76" y1="238" x2="824" y2="238" stroke="#dce5e5"/>
  <g transform="translate(180 300) scale(1.2 1.2)">
    <circle cx="0" cy="30" r="28" fill="#f6dcc8"/>
    <path d="M -32 30 Q -34 -6 0 -4 Q 34 -6 32 30 L 32 52 Q 30 34 22 22 Q 8 6 -22 18 Q -30 26 -32 52 Z" fill="#3a4a52"/>
    <path d="M -32 34 L -36 66 L -26 60 Z" fill="#3a4a52"/>
    <path d="M 32 34 L 36 66 L 26 60 Z" fill="#3a4a52"/>
    <path d="M -48 96 Q -48 66 -22 62 L 22 62 Q 48 66 48 96 L 48 206 Q 48 220 34 220 L -34 220 Q -48 220 -48 206 Z" fill="#E69F00"/>
    <path d="M -22 62 Q 0 78 22 62" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
  </g>
  <circle cx="330" cy="330" r="46" fill="#fdf0ec" stroke="#D55E00" stroke-width="3.5"/>
  <rect x="326" y="304" width="8" height="34" rx="4" fill="#D55E00"/>
  <circle cx="330" cy="352" r="5" fill="#D55E00"/>
  <rect x="76" y="580" width="748" height="76" rx="14" fill="#fdf6f2" stroke="#D55E00" stroke-width="2"/>
  <path d="M 106 602 L 106 634 M 106 602 L 130 610 L 106 618" fill="none" stroke="#D55E00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="615" class="nodeTitle">剧烈疼痛</text>
  <text x="150" y="641" class="small">与平时注射不适明显不同</text>
  <rect x="76" y="672" width="748" height="76" rx="14" fill="#fdf6f2" stroke="#D55E00" stroke-width="2"/>
  <path d="M 106 694 L 106 726 M 106 694 L 130 702 L 106 710" fill="none" stroke="#D55E00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="707" class="nodeTitle">皮肤苍白或花斑</text>
  <text x="150" y="733" class="small">注射区或更远处皮色改变</text>
  <rect x="76" y="764" width="748" height="76" rx="14" fill="#fdf6f2" stroke="#D55E00" stroke-width="2"/>
  <path d="M 106 786 L 106 818 M 106 786 L 130 794 L 106 802" fill="none" stroke="#D55E00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="799" class="nodeTitle">视力变化</text>
  <text x="150" y="825" class="small">视物模糊、黑朦或失明</text>
  <rect x="76" y="856" width="748" height="76" rx="14" fill="#fdf6f2" stroke="#D55E00" stroke-width="2"/>
  <path d="M 106 878 L 106 910 M 106 878 L 130 886 L 106 894" fill="none" stroke="#D55E00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="891" class="nodeTitle">剧烈头痛伴其他症状</text>
  <text x="150" y="917" class="small">神经系统警报</text>
  <rect x="430" y="290" width="330" height="150" rx="18" fill="#f8fbfb" stroke="#e3ebeb"/>
  <text x="595" y="330" class="nodeTitle" text-anchor="middle">时间窗以分钟计</text>
  <text x="595" y="362" class="small" text-anchor="middle">立即告知操作者，停止一切操作</text>
  <text x="595" y="388" class="small" text-anchor="middle">前往有处置能力的医疗机构</text>
  <text x="595" y="414" class="small" text-anchor="middle">说清注射时间、部位与产品</text>
  <rect x="76" y="1020" width="748" height="82" rx="18" fill="#fdf0ec"/>
  <text x="450" y="1071" class="quote" text-anchor="middle">这几分钟的反应速度，就是结局的分界线</text>
  <text x="76" y="1136" class="footer">急症请立即就医 · 本图不替代医生判断</text>
</svg>