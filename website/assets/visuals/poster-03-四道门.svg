<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" aria-labelledby="title desc" role="img" viewBox="0 0 900 1200"><title id="title">打不打，先过四道门</title><desc id="desc">四道门海报，能核验、能撤销、能急救、能追责</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="6" flood-color="#183642" flood-opacity=".1" stdDeviation="9"/></filter><style>.series{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:2px;fill:#0072b2}.title{font:700 44px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 20px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 20px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 24px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="1200" fill="url(#bg)" rx="30"/><rect width="820" height="1120" x="40" y="40" fill="#fff" stroke="#dce8e8" filter="url(#shadow)" opacity=".96" rx="26"/><text x="76" y="104" class="series">注射美容 30 讲 · 终章</text><text x="76" y="166" class="title">打不打，先过四道门</text><text x="76" y="206" class="kicker">能核验 · 能撤销 · 能急救 · 能追责</text><line x1="76" x2="824" y1="238" y2="238" stroke="#dce5e5"/><path fill="#f8fbfb" stroke="#0072B2" stroke-width="3.5" d="M 96 640 L 96 420 Q 175 340 254 420 L 254 640 Z"/><path fill="#0072B2" d="M 132 640 L 132 470 Q 175 424 218 470 L 218 640 Z" opacity=".16"/><text x="175" y="398" fill="#0072B2" class="nodeTitle" text-anchor="middle">能核验</text><text x="175" y="530" class="small" text-anchor="middle"><tspan x="175" dy="0">产品、人、场所</tspan> <tspan x="175" dy="22">全部查得到</tspan></text><path fill="#f8fbfb" stroke="#009E73" stroke-width="3.5" d="M 282 640 L 282 420 Q 361 340 440 420 L 440 640 Z"/><path fill="#009E73" d="M 318 640 L 318 470 Q 361 424 404 470 L 404 640 Z" opacity=".16"/><text x="361" y="398" fill="#009E73" class="nodeTitle" text-anchor="middle">能撤销</text><text x="361" y="530" class="small" text-anchor="middle"><tspan x="361" dy="0">材料可干预</tspan> <tspan x="361" dy="22">方案留余地</tspan></text><path fill="#f8fbfb" stroke="#E69F00" stroke-width="3.5" d="M 468 640 L 468 420 Q 547 340 626 420 L 626 640 Z"/><path fill="#E69F00" d="M 504 640 L 504 470 Q 547 424 590 470 L 590 640 Z" opacity=".16"/><text x="547" y="398" fill="#E69F00" class="nodeTitle" text-anchor="middle">能急救</text><text x="547" y="530" class="small" text-anchor="middle"><tspan x="547" dy="0">急症有人识别</tspan> <tspan x="547" dy="22">有人处置</tspan></text><path fill="#f8fbfb" stroke="#D55E00" stroke-width="3.5" d="M 654 640 L 654 420 Q 733 340 812 420 L 812 640 Z"/><path fill="#D55E00" d="M 690 640 L 690 470 Q 733 424 776 470 L 776 640 Z" opacity=".16"/><text x="733" y="398" fill="#D55E00" class="nodeTitle" text-anchor="middle">能追责</text><text x="733" y="530" class="small" text-anchor="middle"><tspan x="733" dy="0">责任主体明确</tspan> <tspan x="733" dy="22">凭证齐全</tspan></text><line x1="76" x2="824" y1="640" y2="640" stroke="#b9c8cd" stroke-width="3"/><g transform="translate(450 680) scale(1.1 1.1)"><circle cx="0" cy="30" r="28" fill="#f6dcc8"/><path fill="#3a4a52" d="M -32 30 Q -34 -6 0 -4 Q 34 -6 32 30 L 32 52 Q 30 34 22 22 Q 8 6 -22 18 Q -30 26 -32 52 Z"/><path fill="#3a4a52" d="M -32 34 L -36 66 L -26 60 Z"/><path fill="#3a4a52" d="M 32 34 L 36 66 L 26 60 Z"/><path fill="#E69F00" d="M -48 96 Q -48 66 -22 62 L 22 62 Q 48 66 48 96 L 48 206 Q 48 220 34 220 L -34 220 Q -48 220 -48 206 Z"/><path fill="none" stroke="#fff" stroke-width="2.5" d="M -22 62 Q 0 78 22 62" opacity=".7"/></g><text x="450" y="960" class="body" text-anchor="middle">每一道门，都对应系列里可以复查的核验动作</text><rect width="748" height="82" x="76" y="1020" fill="#eef6f8" rx="18"/><text x="450" y="1071" class="quote" text-anchor="middle">四道门都开着，才值得走进去</text><text x="76" y="1136" class="footer">医学科普示意 · 不构成个体诊疗建议，具体决策请面诊</text></svg>