<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">面诊室里的五步核验</title>
  <desc id="desc">当场核验五步海报，包括看人、看场所、看产品、看注册、看记录</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 16px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; letter-spacing: 2px; fill: #0072B2; }
      .title { font: 700 44px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .kicker { font: 500 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #52656c; }
      .nodeTitle { font: 700 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .body { font: 500 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #3e5057; }
      .small { font: 500 14px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #5c6c72; }
      .quote { font: 700 24px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .footer { font: 500 13px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #68787e; }
      .big { font: 700 26px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #ffffff; }
      .ringLabel { font: 700 18px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
    </style>
  </defs>
  <rect width="900" height="1200" rx="30" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="26" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#shadow)"/>
  <text x="76" y="104" class="series">注射美容 30 讲 · 核验卡</text>
  <text x="76" y="166" class="title">面诊室里的五步核验</text>
  <text x="76" y="206" class="kicker">几分钟就能完成的自我保护动作</text>
  <line x1="76" y1="238" x2="824" y2="238" stroke="#dce5e5"/>
  <g transform="translate(190 320) scale(1.15 1.15)">
    <path d="M -30 18 A 30 30 0 0 1 30 18 L 30 6 A 30 30 0 0 0 -30 6 Z" fill="#2f3e46"/>
    <circle cx="0" cy="30" r="28" fill="#f6dcc8"/>
    <path d="M -32 26 Q -32 -2 0 -2 Q 32 -2 32 26 L 32 14 Q 24 2 0 2 Q -24 2 -32 14 Z" fill="#2f3e46"/>
    <path d="M -52 92 Q -52 66 -26 62 L 26 62 Q 52 66 52 92 L 52 210 Q 52 222 40 222 L -40 222 Q -52 222 -52 210 Z" fill="#ffffff" stroke="#c9d8de" stroke-width="2.5"/>
    <path d="M 0 66 L -14 92 L 0 180 L 14 92 Z" fill="#56B4E9" opacity="0.85"/>
    <path d="M -26 62 L 0 92 L 26 62" fill="none" stroke="#c9d8de" stroke-width="2.5"/>
    <rect x="18" y="104" width="20" height="13" rx="3" fill="#0072B2"/>
    <path d="M -14 66 Q -14 96 0 96 Q 14 96 14 66" fill="none" stroke="#009E73" stroke-width="3"/>
    <circle cx="0" cy="100" r="5" fill="#009E73"/>
  </g>
  <g transform="translate(710 320) scale(-1.15 1.15)">
    <circle cx="0" cy="30" r="28" fill="#f6dcc8"/>
    <path d="M -32 30 Q -34 -6 0 -4 Q 34 -6 32 30 L 32 52 Q 30 34 22 22 Q 8 6 -22 18 Q -30 26 -32 52 Z" fill="#3a4a52"/>
    <path d="M -32 34 L -36 66 L -26 60 Z" fill="#3a4a52"/>
    <path d="M 32 34 L 36 66 L 26 60 Z" fill="#3a4a52"/>
    <path d="M -48 96 Q -48 66 -22 62 L 22 62 Q 48 66 48 96 L 48 206 Q 48 220 34 220 L -34 220 Q -48 220 -48 206 Z" fill="#E69F00"/>
    <path d="M -22 62 Q 0 78 22 62" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
  </g>
  <rect x="330" y="330" width="240" height="150" rx="14" fill="#f8fbfb" stroke="#b9c8cd" stroke-width="2.5"/>
  <line x1="330" y1="480" x2="300" y2="580" stroke="#b9c8cd" stroke-width="4"/>
  <line x1="570" y1="480" x2="600" y2="580" stroke="#b9c8cd" stroke-width="4"/>
  <text x="450" y="392" class="nodeTitle" text-anchor="middle">面诊桌上</text>
  <text x="450" y="424" class="small" text-anchor="middle">证照、包装、注册信息、病历</text>
  <rect x="76" y="620" width="748" height="60" rx="14" fill="#f8fbfb" stroke="#e3ebeb"/>
  <circle cx="110" cy="650" r="15" fill="#56B4E9"/>
  <text x="110" y="656" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
  <text x="140" y="657" class="nodeTitle">看人</text>
  <text x="812" y="657" class="body" text-anchor="end">执业信息可查</text>
  <rect x="76" y="694" width="748" height="60" rx="14" fill="#f8fbfb" stroke="#e3ebeb"/>
  <circle cx="110" cy="724" r="15" fill="#E69F00"/>
  <text x="110" y="730" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
  <text x="140" y="731" class="nodeTitle">看场所</text>
  <text x="812" y="731" class="body" text-anchor="end">机构许可公示</text>
  <rect x="76" y="768" width="748" height="60" rx="14" fill="#f8fbfb" stroke="#e3ebeb"/>
  <circle cx="110" cy="798" r="15" fill="#009E73"/>
  <text x="110" y="804" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
  <text x="140" y="805" class="nodeTitle">看产品</text>
  <text x="812" y="805" class="body" text-anchor="end">完整包装当面开封</text>
  <rect x="76" y="842" width="748" height="60" rx="14" fill="#f8fbfb" stroke="#e3ebeb"/>
  <circle cx="110" cy="872" r="15" fill="#CC79A7"/>
  <text x="110" y="878" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
  <text x="140" y="879" class="nodeTitle">看注册</text>
  <text x="812" y="879" class="body" text-anchor="end">证号当场查询</text>
  <rect x="76" y="916" width="748" height="60" rx="14" fill="#f8fbfb" stroke="#e3ebeb"/>
  <circle cx="110" cy="946" r="15" fill="#0072B2"/>
  <text x="110" y="952" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
  <text x="140" y="953" class="nodeTitle">看记录</text>
  <text x="812" y="953" class="body" text-anchor="end">病历与知情同意</text>
  <rect x="76" y="1020" width="748" height="82" rx="18" fill="#eef6f8"/>
  <text x="450" y="1071" class="quote" text-anchor="middle">五步都通过，才轮到谈效果</text>
  <text x="76" y="1136" class="footer">医学科普示意 · 被拒绝核验本身就是红旗</text>
</svg>