<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title desc" role="img" viewBox="0 0 900 620"><title id="title">非法溶脂的风险链</title><desc id="desc">非法溶脂四环风险链</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><linearGradient id="axg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0072B2"/><stop offset=".55" stop-color="#E69F00"/><stop offset="1" stop-color="#D55E00"/></linearGradient><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.quote{font:700 20px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#shadow)" opacity=".96" rx="24"/><text x="62" y="68" class="series">注射美容 30 讲 · 20</text><text x="62" y="117" class="title">非法溶脂的风险链</text><text x="62" y="153" class="kicker">风险不是单点，而是一条完整的链</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="170" height="210" x="62" y="225" fill="#f8fbfb" stroke="#E69F00" stroke-width="2" rx="17"/><circle cx="87" cy="252" r="11" fill="#E69F00"/><text x="107" y="259" class="nodeTitle">成分不明</text><text x="147" y="315" class="body" text-anchor="middle"><tspan x="147" dy="0">配方无标准</tspan> <tspan x="147" dy="27">剂量不可控</tspan></text><path stroke="#7d8e93" stroke-width="2" d="M 240 330 L 256 330"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 250 325 L 256 330 L 250 335"/><rect width="170" height="210" x="264" y="225" fill="#f8fbfb" stroke="#E69F00" stroke-width="2" rx="17"/><circle cx="289" cy="252" r="11" fill="#E69F00"/><text x="309" y="259" class="nodeTitle">操作无资质</text><text x="349" y="315" class="body" text-anchor="middle"><tspan x="349" dy="0">非医疗人员</tspan> <tspan x="349" dy="27">评估缺失</tspan></text><path stroke="#7d8e93" stroke-width="2" d="M 442 330 L 458 330"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 452 325 L 458 330 L 452 335"/><rect width="170" height="210" x="466" y="225" fill="#f8fbfb" stroke="#D55E00" stroke-width="2" rx="17"/><circle cx="491" cy="252" r="11" fill="#D55E00"/><text x="511" y="259" class="nodeTitle">反应不可控</text><text x="551" y="315" class="body" text-anchor="middle"><tspan x="551" dy="0">炎症坏死感染</tspan> <tspan x="551" dy="27">文献均有报告</tspan></text><path stroke="#7d8e93" stroke-width="2" d="M 644 330 L 660 330"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 654 325 L 660 330 L 654 335"/><rect width="170" height="210" x="668" y="225" fill="#f8fbfb" stroke="#D55E00" stroke-width="2" rx="17"/><circle cx="693" cy="252" r="11" fill="#D55E00"/><text x="713" y="259" class="nodeTitle">追责无门</text><text x="753" y="315" class="body" text-anchor="middle"><tspan x="753" dy="0">责任主体不明</tspan> <tspan x="753" dy="27">维权困难</tspan></text><rect width="776" height="72" x="62" y="474" fill="#fdf0ec" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">危险不在某一环，而在每一环都断</text><text x="62" y="570" class="footer">医学科普示意 · 不构成个体诊疗建议，具体决策请面诊</text></svg>