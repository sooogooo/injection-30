<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title desc" role="img" viewBox="0 0 900 620"><title id="title">拒绝也是治疗</title><desc id="desc">应选择拒绝的四类专业情境</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><linearGradient id="axg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0072B2"/><stop offset=".55" stop-color="#E69F00"/><stop offset="1" stop-color="#D55E00"/></linearGradient><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.quote{font:700 20px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#shadow)" opacity=".96" rx="24"/><text x="62" y="68" class="series">注射美容 30 讲 · 28</text><text x="62" y="117" class="title">拒绝也是治疗</text><text x="62" y="153" class="kicker">这些情境下，拒绝是更专业的选择</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="776" height="53" x="62" y="205" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="231" r="9" fill="#E69F00"/><text x="112" y="237" class="nodeTitle">诉求无法实现</text><text x="330" y="237" class="body">期望超出技术边界</text><rect width="776" height="53" x="62" y="270" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="296" r="9" fill="#E69F00"/><text x="112" y="302" class="nodeTitle">动机存疑</text><text x="330" y="302" class="body">重大变故后的冲动决策</text><rect width="776" height="53" x="62" y="335" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="361" r="9" fill="#D55E00"/><text x="112" y="367" class="nodeTitle">筛查阳性线索</text><text x="330" y="367" class="body">先转介评估，再谈治疗</text><rect width="776" height="53" x="62" y="400" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="426" r="9" fill="#D55E00"/><text x="112" y="432" class="nodeTitle">风险大于获益</text><text x="330" y="432" class="body">医学判断优先于成交</text><rect width="776" height="72" x="62" y="474" fill="#eef6f8" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">拒绝的能力，是机构专业度的上限</text><text x="62" y="570" class="footer">专业篇示意 · 不构成个案处置标准</text></svg>