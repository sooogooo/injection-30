ll="#0072B2"/><text x="108" y="244" class="nodeTitle">一般可同期</text><line x1="86" x2="278" y1="260" y2="260" stroke="#e0e9e9"/><circle cx="92" cy="287" r="3.5" fill="#0072B2"/><text x="106" y="292" class="body">目标层次不同</text><circle cx="92" cy="323" r="3.5" fill="#0072B2"/><text x="106" y="328" class="body">互不干扰的组合</text><circle cx="92" cy="359" r="3.5" fill="#0072B2"/><text x="106" y="364" class="body">仍需医生确认</text><rect width="240" height="250" x="330" y="205" fill="#f8fbfb" stroke="#E69F00" stroke-width="2" rx="17"/><circle cx="356" cy="237" r="10" fill="#E69F00"/><text x="376" y="244" class="nodeTitle">建议间隔</text><line x1="354" x2="546" y1="260" y2="260" stroke="#e0e9e9"/><circle cx="360" cy="287" r="3.5" fill="#E69F00"/><text x="374" y="292" class="body">恢复期重叠项目</text><circle cx="360" cy="323" r="3.5" fill="#E69F00"/><text x="374" y="328" class="body">炎症期避免叠加</text><circle cx="360" cy="359" r="3.5" fill="#E69F00"/><text x="374" y="364" class="body">间隔长短个体化</text><rect width="240" height="250" x="598" y="205" fill="#f8fbfb" stroke="#CC79A7" stroke-width="2" rx="17"/><circle cx="624" cy="237" r="10" fill="#CC79A7"/><text x="644" y="244" class="nodeTitle">面诊室参数</text><line x1="622" x2="814" y1="260" y2="260" stroke="#e0e9e9"/><circle cx="628" cy="287" r="3.5" fill="#CC79A7"/><text x="642" y="292" class="body">具体顺序与间隔</text><circle cx="628" cy="323" r="3.5" fill="#CC79A7"/><text x="642" y="328" class="body">剂量与部位组合</text><circle cx="628" cy="359" r="3.5" fill="#CC79A7"/><text x="642" y="364" class="body">不在公开范围</text><rect width="776" height="72" x="62" y="474" fill="#eef6f8" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">时序的原则可以科普，参数只属于面诊</text><text x="62" y="570" class="footer">专业篇示意 · 具体方案由临床医生个体化制定</text></svg>