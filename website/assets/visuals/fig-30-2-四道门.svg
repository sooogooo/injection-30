="#0072B2"/><text x="107" y="259" class="nodeTitle">能核验</text><text x="147" y="315" class="body" text-anchor="middle"><tspan x="147" dy="0">产品人场所</tspan> <tspan x="147" dy="27">全部查得到</tspan></text><path stroke="#7d8e93" stroke-width="2" d="M 240 330 L 256 330"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 250 325 L 256 330 L 250 335"/><rect width="170" height="210" x="264" y="225" fill="#f8fbfb" stroke="#009E73" stroke-width="2" rx="17"/><circle cx="289" cy="252" r="11" fill="#009E73"/><text x="309" y="259" class="nodeTitle">能撤销</text><text x="349" y="315" class="body" text-anchor="middle"><tspan x="349" dy="0">材料可干预</tspan> <tspan x="349" dy="27">方案留余地</tspan></text><path stroke="#7d8e93" stroke-width="2" d="M 442 330 L 458 330"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 452 325 L 458 330 L 452 335"/><rect width="170" height="210" x="466" y="225" fill="#f8fbfb" stroke="#E69F00" stroke-width="2" rx="17"/><circle cx="491" cy="252" r="11" fill="#E69F00"/><text x="511" y="259" class="nodeTitle">能急救</text><text x="551" y="315" class="body" text-anchor="middle"><tspan x="551" dy="0">急症有人识别</tspan> <tspan x="551" dy="27">有人处置</tspan></text><path stroke="#7d8e93" stroke-width="2" d="M 644 330 L 660 330"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 654 325 L 660 330 L 654 335"/><rect width="170" height="210" x="668" y="225" fill="#f8fbfb" stroke="#D55E00" stroke-width="2" rx="17"/><circle cx="693" cy="252" r="11" fill="#D55E00"/><text x="713" y="259" class="nodeTitle">能追责</text><text x="753" y="315" class="body" text-anchor="middle"><tspan x="753" dy="0">责任主体明确</tspan> <tspan x="753" dy="27">凭证齐全</tspan></text><rect width="776" height="72" x="62" y="474" fill="#eef6f8" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">四道门都开着，才值得走进去</text><text x="62" y="570" class="footer">医学科普示意 · 不构成个体诊疗建议，具体决策请面诊</text></svg>