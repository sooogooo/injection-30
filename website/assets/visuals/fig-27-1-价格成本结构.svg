<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title desc" role="img" viewBox="0 0 900 620"><title id="title">一支合规针剂的成本构成</title><desc id="desc">合规注射的五项成本结构</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><linearGradient id="axg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0072B2"/><stop offset=".55" stop-color="#E69F00"/><stop offset="1" stop-color="#D55E00"/></linearGradient><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.quote{font:700 20px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#shadow)" opacity=".96" rx="24"/><text x="62" y="68" class="series">注射美容 30 讲 · 27</text><text x="62" y="117" class="title">一支合规针剂的成本构成</text><text x="62" y="153" class="kicker">价格里应该包含的五种成本</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="776" height="40" x="62" y="205" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="225" r="9" fill="#56B4E9"/><text x="112" y="231" class="nodeTitle">药械成本</text><text x="330" y="231" class="body">合法产品与冷链储运</text><rect width="776" height="40" x="62" y="257" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="277" r="9" fill="#009E73"/><text x="112" y="283" class="nodeTitle">人员成本</text><text x="330" y="283" class="body">医生资质与持续训练</text><rect width="776" height="40" x="62" y="309" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="329" r="9" fill="#0072B2"/><text x="112" y="335" class="nodeTitle">场所成本</text><text x="330" y="335" class="body">合规机构与设备维护</text><rect width="776" height="40" x="62" y="361" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="381" r="9" fill="#E69F00"/><text x="112" y="387" class="nodeTitle">应急成本</text><text x="330" y="387" class="body">急救准备与预案演练</text><rect width="776" height="40" x="62" y="413" fill="#f8fbfb" stroke="#e3ebeb" rx="12"/><circle cx="92" cy="433" r="9" fill="#CC79A7"/><text x="112" y="439" class="nodeTitle">责任成本</text><text x="330" y="439" class="body">保险、赔付与售后</text><rect width="776" height="72" x="62" y="474" fill="#eef6f8" rx="16"/><text x="450" y="518" class="quote" text-anchor="middle">低价省掉的，通常是你看不见的那几项</text><text x="62" y="570" class="footer">医学科普示意 · 不构成个体诊疗建议，具体决策请面诊</text></svg>