<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">免疫原性的证据强度分层</title>
  <desc id="desc">免疫原性各环节的证据强度分层</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <linearGradient id="axg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0072B2"/>
      <stop offset="0.55" stop-color="#E69F00"/>
      <stop offset="1" stop-color="#D55E00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; letter-spacing: 1.4px; fill: #0072B2; }
      .title { font: 700 31px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #52656c; }
      .nodeTitle { font: 700 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .body { font: 500 15px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #3e5057; }
      .small { font: 500 13px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #5c6c72; }
      .quote { font: 700 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17323d; }
      .footer { font: 500 12px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #68787e; }
      .tag { font: 700 13px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#shadow)"/>
  <text x="62" y="68" class="series">注射美容 30 讲 · 11</text>
  <text x="62" y="117" class="title">免疫原性的证据强度分层</text>
  <text x="62" y="153" class="kicker">机制明确，但各环节证据强度并不一致</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>
  <rect x="62" y="205" width="776" height="53" rx="12" fill="#f8fbfb" stroke="#e3ebeb"/>
  <circle cx="92" cy="231" r="9" fill="#009E73"/>
  <text x="112" y="237" class="nodeTitle">中和抗体可发生</text>
  <text x="330" y="237" class="body">与制剂蛋白载量等因素相关</text>
  <text x="826" y="237" class="tag" text-anchor="end" fill="#009E73">较稳定</text>
  <rect x="62" y="270" width="776" height="53" rx="12" fill="#f8fbfb" stroke="#e3ebeb"/>
  <circle cx="92" cy="296" r="9" fill="#009E73"/>
  <text x="112" y="302" class="nodeTitle">部分无应答与抗体相关</text>
  <text x="330" y="302" class="body">继发无应答的机制之一</text>
  <text x="826" y="302" class="tag" text-anchor="end" fill="#009E73">较稳定</text>
  <rect x="62" y="335" width="776" height="53" rx="12" fill="#f8fbfb" stroke="#e3ebeb"/>
  <circle cx="92" cy="361" r="9" fill="#E69F00"/>
  <text x="112" y="367" class="nodeTitle">高频高量增加风险</text>
  <text x="330" y="367" class="body">以观察性证据为主</text>
  <text x="826" y="367" class="tag" text-anchor="end" fill="#E69F00">有限</text>
  <rect x="62" y="400" width="776" height="53" rx="12" fill="#f8fbfb" stroke="#e3ebeb"/>
  <circle cx="92" cy="426" r="9" fill="#E69F00"/>
  <text x="112" y="432" class="nodeTitle">换制剂可恢复应答</text>
  <text x="330" y="432" class="body">个案与小样本报告</text>
  <text x="826" y="432" class="tag" text-anchor="end" fill="#E69F00">有限</text>
  <rect x="62" y="474" width="776" height="72" rx="16" fill="#eef6f8"/>
  <text x="450" y="518" class="quote" text-anchor="middle">把「可能」当「必然」，会做出错误决策</text>
  <text x="62" y="570" class="footer">专业篇示意 · 依据 Ho 2022 国际共识等文献，不构成诊疗规范</text>
</svg>